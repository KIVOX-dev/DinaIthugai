name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # reused by deploy-backend.yml so a deploy can never skip the checks

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24] # 20 = Catalyst AppSail runtime, 24 = local/Docker runtime
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests (real MongoDB via mongodb-memory-server)
        run: npm test
      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # Build-time only: baked into the /api/* rewrite. No real backend is contacted during the build.
      BACKEND_URL: https://api.example.invalid
      NEXT_PUBLIC_SITE_URL: https://www.example.invalid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm ci
      - name: Shared modules are in sync with the backend (source of truth)
        run: |
          node scripts/sync-shared.mjs
          git diff --exit-code -- lib/shared || (echo "::error::frontend/lib/shared is out of date. Run 'npm run sync:shared' in frontend/ and commit." && exit 1)
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # secret scan covers history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependency audit (production deps, fail on high)
        run: |
          (cd backend && npm audit --omit=dev --audit-level=high)
          (cd frontend && npm audit --omit=dev --audit-level=high)
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact --verbose

  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Single required status check for branch protection.
  ci-ok:
    name: CI passed
    if: always()
    needs: [backend, frontend, security, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi
